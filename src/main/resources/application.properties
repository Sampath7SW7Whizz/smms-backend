spring.application.name=backend

# Server Configuration
server.port=8080

# Database Configuration - H2 file stored beside the running app
spring.datasource.url=jdbc:h2:file:./data/smms_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;CACHE_SIZE=32768;LOCK_TIMEOUT=10000;MV_STORE=TRUE;OPTIMIZE_REUSE_RESULTS=TRUE
spring.datasource.username=root
spring.datasource.password=codeforfazal
spring.datasource.driver-class-name=org.h2.Driver

# HikariCP Connection Pool (OPTIMIZED)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA / Hibernate Configuration (OPTIMIZED)         
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.default_batch_fetch_size=16
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Transaction isolation level for sequential ID generation (CRITICAL for preventing duplicates)
spring.jpa.properties.hibernate.connection.isolation=2

# Enable SQL initialization for indexes
spring.sql.init.mode=always

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=sales,dailySales,products

# ── Offline-first application settings ──────────────────────
smms.payment.offline-mode=false
smms.mail.offline-mode=true

