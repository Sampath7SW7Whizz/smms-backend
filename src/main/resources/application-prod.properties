spring.application.name=backend

# Server Configuration
server.port=8080

# ═══════════════════════════════════════════════════════════════
# H2 Embedded Database Configuration (No MySQL installation needed!)
# ═══════════════════════════════════════════════════════════════
# Store database in user's home folder to avoid permission issues
spring.datasource.url=jdbc:h2:file:~/smms_data/smms_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL;CACHE_SIZE=16384
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Connection pool settings for faster response
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
# idle-timeout: how long idle connections stay in pool before eviction (10 min)
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-timeout=10000
# keepalive-time: sends a heartbeat pin every 60s to prevent stale H2 connections
spring.datasource.hikari.keepalive-time=60000
# Validate connection before handing it out from the pool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false

# H2 Console (enabled for viewing data)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

